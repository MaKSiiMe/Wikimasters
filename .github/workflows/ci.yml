name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements-dev.txt
      - run: pip install -r tracker/requirements-dev.txt
      - run: cd tracker && pytest -q

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml_predictor/requirements*.txt
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ml_predictor/requirements-dev.txt -r ml_predictor/requirements-train.txt
      - run: cd ml_predictor && pytest -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api_bridge/package-lock.json
      - run: cd api_bridge && npm ci && npm test

  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check userscript/wikimasters-hud.user.js

  docker:
    runs-on: ubuntu-latest
    needs: [tracker, ml, api]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
